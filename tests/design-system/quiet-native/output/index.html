<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <title>待办 · 任务管理</title>
  <style>
    :root{--bg-primary:#f2f2f7;--bg-surface:#fff;--bg-secondary:#e9e9ee;--text-primary:#1c1c1e;--text-secondary:#6e6e73;--text-tertiary:#a9a9ae;--separator:rgba(60,60,67,.12);--accent:#007aff;--accent-active:#0a64d8;--accent-soft:rgba(0,122,255,.12);--on-accent:#fff;--danger:#ff3b30;--danger-soft:rgba(255,59,48,.12);--success:#34c759;--glass-bg:rgba(249,249,251,.72);--glass-nav-bg:rgba(250,250,252,.52);--glass-nav-border:rgba(255,255,255,.55);--overlay:rgba(0,0,0,.4);--shadow-control:0 .5px 2px rgba(0,0,0,.08);--shadow-sheet:0 -12px 40px rgba(0,0,0,.16);--shadow-float:0 8px 28px rgba(0,0,0,.12);color-scheme:light}
    :root.dark{--bg-primary:#000;--bg-surface:#1c1c1e;--bg-secondary:#2c2c2e;--text-primary:#f2f2f7;--text-secondary:#98989d;--text-tertiary:#636366;--separator:rgba(84,84,88,.6);--accent:#0a84ff;--accent-active:#409cff;--accent-soft:rgba(10,132,255,.22);--danger:#ff453a;--danger-soft:rgba(255,69,58,.18);--success:#30d158;--glass-bg:rgba(22,22,24,.78);--glass-nav-bg:rgba(30,30,32,.5);--glass-nav-border:rgba(255,255,255,.14);--overlay:rgba(0,0,0,.55);--shadow-control:0 .5px 2px rgba(0,0,0,.4);--shadow-sheet:0 -12px 40px rgba(0,0,0,.5);--shadow-float:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg-primary);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif}body{margin:0;min-height:100vh;background:var(--bg-primary);color:var(--text-primary);font-size:17px;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit;color:inherit}button{border:0;cursor:pointer}button,input,textarea,select{touch-action:manipulation}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.app{min-height:100vh}.sidebar{display:none}.main{max-width:760px;margin:auto;padding:32px 20px 112px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.eyebrow{margin:0 0 4px;color:var(--text-secondary);font-size:15px}.title{margin:0;font-size:32px;line-height:1.15;letter-spacing:-.6px}.actions{display:flex;gap:8px}.icon-btn{display:grid;width:44px;height:44px;place-items:center;border-radius:50%;background:var(--bg-surface);color:var(--text-secondary);transition:.15s}.icon-btn:hover{background:var(--bg-secondary);color:var(--text-primary)}.segment{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:24px;padding:2px;border-radius:10px;background:var(--bg-secondary)}.segment button{z-index:1;min-height:36px;background:transparent;color:var(--text-secondary);font-size:14px}.segment button.active{color:var(--text-primary);font-weight:600}.segment-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);border-radius:8px;background:var(--bg-surface);box-shadow:var(--shadow-control);transition:transform .22s cubic-bezier(.2,.8,.2,1)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}.metric{padding:16px;border-radius:16px;background:var(--bg-surface)}.metric strong{display:block;font-size:24px;line-height:1.2}.metric span{color:var(--text-secondary);font-size:13px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px}.section-head h2{margin:0;font-size:15px;font-weight:500;color:var(--text-secondary)}.plain{min-height:44px;padding:0 8px;background:transparent;color:var(--accent);font-size:15px}.task-list{overflow:hidden;border-radius:16px;background:var(--bg-surface)}.task{display:grid;grid-template-columns:44px 1fr auto;align-items:center;min-height:76px;padding:8px 12px;border-bottom:.5px solid var(--separator);transition:.15s}.task:last-child{border-bottom:0}.task:hover{background:var(--bg-secondary)}.check{display:grid;width:28px;height:44px;place-items:center;background:transparent;color:var(--text-tertiary)}.check span{width:23px;height:23px;border:1.5px solid currentColor;border-radius:50%}.task.done .check span{display:grid;place-items:center;border-color:var(--success);background:var(--success);color:white}.task.done .check span:after{content:'✓';font-size:15px}.task-copy{min-width:0}.task-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}.task-copy small{display:block;margin-top:3px;color:var(--text-secondary);font-size:13px}.task.done .task-copy strong{text-decoration:line-through;color:var(--text-tertiary)}.priority{width:8px;height:8px;margin:0 12px;border-radius:50%;background:var(--accent)}.priority.urgent{background:var(--danger)}.notice{display:flex;align-items:center;gap:12px;margin:0 0 20px;padding:12px 16px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-size:14px}.notice button{margin-left:auto;background:transparent;color:inherit;font-weight:600}.empty{display:none;padding:56px 24px;text-align:center;border-radius:16px;background:var(--bg-surface)}.empty .empty-icon{display:grid;width:52px;height:52px;margin:0 auto 16px;place-items:center;border-radius:16px;background:var(--bg-secondary);color:var(--text-secondary)}.empty h3{margin:0 0 4px;font-size:18px}.empty p{margin:0;color:var(--text-secondary);font-size:15px}.fab{position:fixed;right:20px;bottom:88px;display:grid;width:56px;height:56px;place-items:center;border-radius:18px;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 24px var(--accent-soft);transition:.15s}.fab:hover{background:var(--accent-active)}.fab:active{transform:scale(.97)}.bottom-nav{position:fixed;z-index:3;right:16px;bottom:calc(env(safe-area-inset-bottom) + 10px);left:16px;display:grid;grid-template-columns:repeat(3,1fr);height:64px;padding:4px 8px;border:.5px solid var(--glass-nav-border);border-radius:999px;background:var(--glass-nav-bg);box-shadow:var(--shadow-float);backdrop-filter:saturate(190%) blur(28px)}.nav-item{display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--text-secondary);font-size:12px}.nav-item.active{color:var(--accent);font-weight:600}.nav-item .icon{width:21px}dialog{width:min(560px,100%);max-width:none;margin:auto 0 0;border:0;border-radius:20px 20px 0 0;padding:0;background:var(--glass-bg);color:var(--text-primary);box-shadow:var(--shadow-sheet);backdrop-filter:saturate(190%) blur(28px)}dialog::backdrop{background:var(--overlay)}dialog[open]{animation:up .3s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:0}}.sheet{padding:8px 20px calc(env(safe-area-inset-bottom) + 24px)}.handle{width:36px;height:4px;margin:0 auto 12px;border-radius:999px;background:var(--separator)}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet-head h2{margin:0;font-size:21px}.close{width:44px;height:44px;border-radius:50%;background:var(--bg-secondary);color:var(--text-secondary)}form{margin-top:16px}.field{margin-bottom:16px}.field label{display:block;margin:0 4px 6px;font-size:14px;font-weight:600}.field input,.field textarea,.field select{width:100%;min-height:48px;padding:12px;border:1px solid var(--separator);border-radius:12px;background:var(--bg-surface);outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-error{display:none;margin:-4px 4px 12px;color:var(--danger);font-size:13px}.primary{width:100%;min-height:48px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600}.primary:hover{background:var(--accent-active)}
    @media(min-width:860px){.app{display:grid;grid-template-columns:240px 1fr}.sidebar{position:sticky;top:0;display:flex;height:100vh;flex-direction:column;padding:32px 20px;border-right:.5px solid var(--separator);background:var(--bg-surface)}.brand{display:flex;align-items:center;gap:10px;margin:0 12px 32px;font-size:20px;font-weight:700}.brand-mark{display:grid;width:32px;height:32px;place-items:center;border-radius:10px;background:var(--accent);color:white}.side-nav{display:grid;gap:4px}.side-nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;background:transparent;color:var(--text-secondary);text-align:left}.side-nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}.side-nav .count{margin-left:auto;font-size:13px}.sidebar-footer{margin-top:auto;padding:16px 12px 0;border-top:.5px solid var(--separator);color:var(--text-secondary);font-size:13px}.main{width:100%;padding:48px 40px 72px}.bottom-nav{display:none}.fab{right:40px;bottom:36px}dialog{margin:auto;border-radius:20px}.sheet{padding:8px 24px 24px}}
    @media(max-width:480px){.main{padding:24px 16px 104px}.summary{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}.field-row{grid-template-columns:1fr}.nav-item{flex-direction:column;gap:1px}.fab{bottom:92px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
  <style>
    .selectbox{position:relative}.selectbox>select{display:none}.select-trigger{display:flex;width:100%;min-height:48px;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--separator);border-radius:12px;background:var(--bg-surface);text-align:left}.select-trigger:after{width:8px;height:8px;margin:-4px 2px 0 12px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);content:""}.select-trigger[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.select-trigger[aria-expanded="true"]:after{margin-top:4px;transform:rotate(225deg)}.select-menu{position:absolute;z-index:10;top:calc(100% + 4px);right:0;left:0;padding:4px;border:1px solid var(--separator);border-radius:16px;background:var(--bg-surface);box-shadow:var(--shadow-float)}.select-menu[hidden]{display:none}.select-option{display:flex;width:100%;min-height:44px;align-items:center;justify-content:space-between;padding:0 12px;border-radius:12px;background:transparent;text-align:left}.select-option:hover,.select-option:focus-visible{background:var(--bg-secondary)}.select-option[aria-selected="true"]{background:var(--accent-soft);font-weight:600}.select-option[aria-selected="true"]:after{color:var(--accent);content:"✓"}
    .selectbox.open-up .select-menu{top:auto;bottom:calc(100% + 28px)}dialog{overflow:visible}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✓</span>待办</div>
      <nav class="side-nav" aria-label="任务分类">
        <button class="active" data-filter="all"><svg class="icon"><use href="#list"/></svg>全部任务 <span class="count" id="sideCount">4</span></button>
        <button data-filter="today"><svg class="icon"><use href="#calendar"/></svg>今天 <span class="count">3</span></button>
        <button data-filter="done"><svg class="icon"><use href="#checkCircle"/></svg>已完成</button>
      </nav>
      <div class="sidebar-footer">今天也在稳步推进。</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow" id="dateLabel"></p><h1 class="title">我的任务</h1></div>
        <div class="actions"><button class="icon-btn" id="theme" aria-label="切换深色模式"><svg class="icon"><use href="#moon"/></svg></button></div>
      </header>
      <div class="notice" id="errorNotice" role="alert"><svg class="icon"><use href="#alert"/></svg><span>“团队项目”同步失败，请检查网络连接。</span><button id="retry">重试</button></div>
      <div class="segment" aria-label="任务筛选">
        <span class="segment-thumb"></span>
        <button class="active" data-filter="all">全部</button><button data-filter="today">今天</button><button data-filter="done">已完成</button>
      </div>
      <section class="summary" aria-label="任务概览">
        <div class="metric"><strong id="todoCount">3</strong><span>待完成</span></div><div class="metric"><strong id="doneCount">1</strong><span>已完成</span></div><div class="metric"><strong>75%</strong><span>本周完成率</span></div>
      </section>
      <div class="section-head"><h2 id="sectionTitle">全部任务</h2><button class="plain" id="clearDone">清除已完成</button></div>
      <div class="task-list" id="taskList"></div>
      <div class="empty" id="empty"><div class="empty-icon"><svg class="icon"><use href="#checkCircle"/></svg></div><h3>这里很清静</h3><p>暂时没有符合条件的任务。</p></div>
    </main>
    <button class="fab" id="add" aria-label="新建任务"><svg class="icon"><use href="#plus"/></svg></button>
    <nav class="bottom-nav" aria-label="主导航"><button class="nav-item active" data-filter="all"><svg class="icon"><use href="#list"/></svg><span>任务</span></button><button class="nav-item" data-filter="today"><svg class="icon"><use href="#calendar"/></svg><span>今天</span></button><button class="nav-item" data-filter="done"><svg class="icon"><use href="#checkCircle"/></svg><span>完成</span></button></nav>
  </div>
  <dialog id="taskDialog">
    <div class="sheet"><div class="handle"></div><div class="sheet-head"><h2>新建任务</h2><button class="close" id="close" aria-label="关闭">×</button></div>
      <form id="taskForm"><div class="field"><label for="taskName">任务名称</label><input id="taskName" maxlength="60" placeholder="例如：整理项目周报" required></div><p class="form-error" id="formError">请输入任务名称</p>
        <div class="field"><label for="taskNote">备注</label><textarea id="taskNote" maxlength="160" placeholder="补充必要信息（可选）"></textarea></div>
        <div class="field-row"><div class="field"><label for="taskDate">日期</label><input id="taskDate" type="date" required></div><div class="field"><label for="taskPriority">优先级</label><select id="taskPriority"><option value="normal">普通</option><option value="urgent">紧急</option></select></div></div>
        <button class="primary" type="submit">添加任务</button>
      </form>
    </div>
  </dialog>
  <svg width="0" height="0" aria-hidden="true"><symbol id="list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol><symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol><symbol id="checkCircle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol><symbol id="moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></symbol><symbol id="alert" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5M12 17h.01"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol></svg>
  <script>
    const today=new Date().toISOString().slice(0,10),tasks=[
      {id:1,title:'完成 Quiet Native 页面',note:'完善响应式布局与交互细节',date:today,priority:'urgent',done:false},
      {id:2,title:'回复设计评审意见',note:'3 条未处理反馈',date:today,priority:'normal',done:false},
      {id:3,title:'预订周五会议室',note:'下午 3:00 · 6 人',date:today,priority:'normal',done:false},
      {id:4,title:'更新项目里程碑',note:'昨天已完成',date:'2026-08-25',priority:'normal',done:true}
    ];
    let filter='all';const list=document.querySelector('#taskList'),empty=document.querySelector('#empty'),dialog=document.querySelector('#taskDialog');
    const label={all:'全部任务',today:'今天',done:'已完成'};
    function enhanceSelect(select){
      const box=document.createElement('div'),trigger=document.createElement('button'),menu=document.createElement('div'),fieldLabel=document.querySelector(`label[for="${select.id}"]`);
      let handledEscape=false;
      box.className='selectbox';trigger.type='button';trigger.className='select-trigger';trigger.id=`${select.id}Trigger`;trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');menu.className='select-menu';menu.role='listbox';menu.hidden=true;menu.setAttribute('aria-label',fieldLabel?.textContent||'选择选项');
      select.before(box);box.append(select,trigger,menu);fieldLabel?.setAttribute('for',trigger.id);
      [...select.options].forEach(option=>{const button=document.createElement('button');button.type='button';button.className='select-option';button.role='option';button.dataset.value=option.value;button.textContent=option.textContent;button.onclick=()=>{select.value=option.value;sync();close();trigger.focus()};menu.append(button)});
      const sync=()=>{trigger.textContent=select.selectedOptions[0]?.textContent||'';menu.querySelectorAll('.select-option').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.value===select.value)))};
      const close=()=>{menu.hidden=true;box.classList.remove('open-up');trigger.setAttribute('aria-expanded','false')};
      trigger.onclick=()=>{const open=menu.hidden;menu.hidden=!open;trigger.setAttribute('aria-expanded',String(open));if(open){box.classList.toggle('open-up',menu.getBoundingClientRect().bottom>innerHeight-8);menu.querySelector('[aria-selected="true"]')?.focus()}};
      menu.onkeydown=event=>{const options=[...menu.children],index=options.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?options.length-1:(index+(event.key==='ArrowDown'?1:-1)+options.length)%options.length;options[next].focus()}if(event.key==='Escape'){event.preventDefault();handledEscape=true;setTimeout(()=>handledEscape=false);close();trigger.focus()}};
      select.closest('dialog')?.addEventListener('cancel',event=>{if(handledEscape)event.preventDefault()});
      document.addEventListener('click',event=>{if(!box.contains(event.target))close()});select.form?.addEventListener('reset',()=>queueMicrotask(sync));select._sync=sync;sync();return box;
    }
    enhanceSelect(document.querySelector('#taskPriority'));
    console.assert(document.querySelectorAll('.selectbox').length===document.querySelectorAll('select').length,'自定义选择器未完整初始化');
    function render(){const shown=tasks.filter(t=>filter==='all'||filter==='today'&&!t.done&&t.date===today||filter==='done'&&t.done);list.innerHTML=shown.map(t=>`<article class="task ${t.done?'done':''}" data-id="${t.id}"><button class="check" aria-label="${t.done?'标为未完成':'标为已完成'}"><span></span></button><div class="task-copy"><strong>${escapeHtml(t.title)}</strong><small>${escapeHtml(t.note||dateText(t.date))}</small></div><i class="priority ${t.priority}" aria-label="${t.priority==='urgent'?'紧急':'普通'}"></i></article>`).join('');list.style.display=shown.length?'block':'none';empty.style.display=shown.length?'none':'block';document.querySelector('#todoCount').textContent=tasks.filter(t=>!t.done).length;document.querySelector('#doneCount').textContent=tasks.filter(t=>t.done).length;document.querySelector('#sideCount').textContent=tasks.length;document.querySelector('#sectionTitle').textContent=label[filter]}
    function escapeHtml(value){const el=document.createElement('span');el.textContent=value;return el.innerHTML}
    function dateText(date){return date===today?'今天':new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric'}).format(new Date(date+'T00:00:00'))}
    function setFilter(next){filter=next;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===next));document.querySelector('.segment-thumb').style.transform=`translateX(${['all','today','done'].indexOf(next)*100}%)`;render()}
    document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));
    list.onclick=e=>{const task=e.target.closest('.task');if(!e.target.closest('.check')||!task)return;const item=tasks.find(t=>t.id===+task.dataset.id);item.done=!item.done;render()};
    document.querySelector('#add').onclick=()=>{document.querySelector('#taskDate').value=today;dialog.showModal();setTimeout(()=>document.querySelector('#taskName').focus(),100)};
    document.querySelector('#close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};
    document.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();const title=document.querySelector('#taskName').value.trim(),error=document.querySelector('#formError');if(!title){error.style.display='block';return}error.style.display='none';tasks.unshift({id:Date.now(),title,note:document.querySelector('#taskNote').value.trim(),date:document.querySelector('#taskDate').value,priority:document.querySelector('#taskPriority').value,done:false});e.target.reset();dialog.close();setFilter('all')};
    document.querySelector('#clearDone').onclick=()=>{for(let i=tasks.length-1;i>=0;i--)if(tasks[i].done)tasks.splice(i,1);render()};
    document.querySelector('#retry').onclick=()=>document.querySelector('#errorNotice').remove();
    const root=document.documentElement,theme=document.querySelector('#theme'),meta=document.querySelector('meta[name="theme-color"]');
    function setTheme(dark){root.classList.toggle('dark',dark);localStorage.setItem('theme',dark?'dark':'light');meta.content=dark?'#000000':'#f2f2f7';theme.setAttribute('aria-label',dark?'切换浅色模式':'切换深色模式')}
    setTheme(localStorage.getItem('theme')==='dark'||!localStorage.getItem('theme')&&matchMedia('(prefers-color-scheme:dark)').matches);theme.onclick=()=>setTheme(!root.classList.contains('dark'));
    document.querySelector('#dateLabel').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());render();
  </script>
</body>
</html>
